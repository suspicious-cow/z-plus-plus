[package]
name = "zpp"
version = "0.1.0"
edition = "2021"
description = "z++: a small, fast plain text editor for Windows"
license = "Apache-2.0"
repository = "https://github.com/suspicious-cow/z-plus-plus"
readme = "README.md"
publish = false

[features]
default = ["bundled-fonts"]
# Embeds the open-licensed fonts in fonts/ (about 2 MB). Build with --no-default-features to leave them out.
bundled-fonts = []

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
