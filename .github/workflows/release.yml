name: Release

# Push a tag like v0.2.0 to build both architectures and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            arch: x64
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/aarch64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain stable --profile minimal
            Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"
            $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          }
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Test
        run: cargo test --target ${{ matrix.target }}

      - name: Build and package
        shell: pwsh
        run: |
          cargo build --release --target ${{ matrix.target }}
          $dir = "zpp-${{ github.ref_name }}-${{ matrix.arch }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/${{ matrix.target }}/release/zpp.exe, LICENSE, NOTICE, README.md, scripts/install.ps1 $dir
          Copy-Item fonts/licenses $dir/font-licenses -Recurse
          Compress-Archive -Path $dir/* -DestinationPath "$dir.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: zpp-${{ matrix.arch }}
          path: zpp-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip --repo "${{ github.repository }}" --title "z++ ${{ github.ref_name }}" --generate-notes
